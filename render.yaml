# Render Blueprint: https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repo. Render generates APP_KEY and provides the
# public URL; you only type the admin password when prompted.
services:
    - type: web
      name: plug-n-paw-admin
      runtime: docker
      plan: free
      region: singapore
      branch: main
      dockerfilePath: ./Dockerfile
      healthCheckPath: /up
      autoDeploy: true
      envVars:
          - key: APP_KEY
            generateValue: true
          - key: APP_NAME
            value: Plug N Paw Admin
          - key: DEMO_MODE
            value: 'true'
          - key: ADMIN_EMAIL
            value: admin@admin.com
          # Not stored in this public repo: Render asks for it when you apply
          # the Blueprint.
          - key: ADMIN_PASSWORD
            sync: false
