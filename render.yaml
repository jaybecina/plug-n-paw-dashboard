# Render Blueprint: https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repo. Nothing else to configure: Render
# generates APP_KEY and provides the public URL.
services:
    - type: web
      name: plug-n-paw-admin
      runtime: docker
      plan: free
      region: singapore
      branch: main
      dockerfilePath: ./Dockerfile
      healthCheckPath: /up
      autoDeploy: true
      envVars:
          - key: APP_KEY
            generateValue: true
          - key: APP_NAME
            value: Plug N Paw Admin
          - key: DEMO_MODE
            value: 'true'
          - key: ADMIN_EMAIL
            value: admin@plugnpaw.test
          - key: ADMIN_PASSWORD
            value: password
